services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crawler
    init: true
    shm_size: "2gb"
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_HOST: "http://ollama:11434"
      DISPLAY: "${DISPLAY}"
      XAUTHORITY: "/tmp/.docker.xauth"
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
    command: ["sleep", "infinity"]
    restart: "no"

  save-auth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: python save_auth.py
    environment:
      PYTHONUNBUFFERED: "1"
      DISPLAY: "${DISPLAY}"
      XAUTHORITY: "/tmp/.docker.xauth"
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
    restart: "no"

volumes:
  ollama_data:
