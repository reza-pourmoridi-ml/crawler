<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Crawler Control
        {% endblock %}
    </title>

    <style>

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            margin: 0;

            background: #0f172a;

            color: #e2e8f0;
        }

        nav {
            background: #020617;

            border-bottom:
                1px solid #1e293b;

            padding: 14px 24px;
        }

        nav .nav-container {
            max-width: 1000px;

            margin: 0 auto;

            display: flex;

            gap: 10px;

            align-items: center;
        }

        nav a {
            color: #cbd5e1;

            text-decoration: none;

            padding: 8px 12px;

            border-radius: 6px;
        }

        nav a:hover {
            background: #1e293b;

            color: #ffffff;
        }

        .container {
            max-width: 1000px;

            margin: 30px auto;

            padding: 24px;

            background: #1e293b;

            border-radius: 8px;

            box-shadow:
                0 4px 6px -1px
                rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 16px;
        }

        th,
        td {
            text-align: right;

            padding: 12px;

            border-bottom:
                1px solid #334155;
        }

        th {
            background: #334155;

            color: #f8fafc;
        }

        mark {
            background: #22c55e;

            color: #022c22;

            padding: 2px 8px;

            border-radius: 4px;

            font-weight: bold;
        }

        code {
            background: #0f172a;

            padding: 2px 6px;

            border-radius: 4px;

            color: #38bdf8;
        }

        .button {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border: none;

            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .button-danger {
            background: #dc2626;
        }

        .button-danger:hover {
            background: #b91c1c;
        }

        input {
            box-sizing: border-box;
        }

        * { box-sizing: border-box; }
        body { line-height: 1.8; }
        a { color: #7dd3fc; text-underline-offset: 3px; }
        nav .nav-container { flex-wrap: wrap; }
        nav a[aria-current="page"] { background: #1e293b; color: #fff; }
        .brand { color: #f8fafc; font-weight: 700; margin-left: auto; }
        h1, h2, h3 { line-height: 1.5; }
        .page-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .page-header h1, .page-header h2 { margin: 0 0 8px; }
        .page-header p, .help-text { color: #94a3b8; margin: 6px 0; }
        .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .actions form { margin: 0; }
        .button { font: inherit; white-space: nowrap; }
        .button-secondary { background: #334155; }
        .button-secondary:hover { background: #475569; }
        .button:disabled { opacity: .5; cursor: not-allowed; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .form-field { margin-bottom: 24px; }
        .form-field label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { max-width: 100%; font: inherit; }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%; padding: 10px 12px; background: #0f172a; color: #e2e8f0;
            border: 1px solid #475569; border-radius: 6px;
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid #60a5fa; outline-offset: 2px; }
        a:focus-visible, button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 3px; }
        .error { background: #7f1d1d; border: 1px solid #ef4444; padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .empty-state { text-align: center; padding: 40px 16px; border: 1px dashed #475569; border-radius: 8px; }
        .table-wrap { overflow-x: auto; }
        .badge { display: inline-block; background: #0f172a; color: #7dd3fc; padding: 2px 10px; border-radius: 5px; }
        .help-text { font-size: .9rem; }
        .help-text a, .empty-state a:not(.button), dd a { color: #7dd3fc; }
        code { display: inline-block; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
        dt { color: #94a3b8; margin-top: 16px; }
        dd { margin: 4px 0 20px; overflow-wrap: anywhere; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        .summary-card { display: block; border: 1px solid #334155; background: #0f172a; border-radius: 8px; padding: 20px; color: #e2e8f0; text-decoration: none; }
        .summary-card:hover { border-color: #60a5fa; }
        .summary-card p { color: #94a3b8; margin-bottom: 0; }
        @media (max-width: 700px) {
            .container { margin: 16px 10px; padding: 16px; }
            nav { padding: 12px; }
            nav .nav-container { gap: 4px; }
            .brand { width: 100%; }
            .page-header { align-items: flex-start; flex-direction: column; }
            .form-grid, .summary-grid { grid-template-columns: 1fr; }
            th, td { padding: 10px 8px; }
            .alias-row input { min-width: 0; }
        }
        .success {
            margin: 0 0 16px;
            padding: 12px 14px;
            border: 1px solid #166534;
            background: #052e16;
            border-radius: 8px;
            color: #bbf7d0;
        }

        .airport-matrix-wrap {
            overflow-x: auto;
        }

        .airport-matrix {
            min-width: 900px;
        }

        .airport-matrix th,
        .airport-matrix td {
            vertical-align: middle;
        }

        .airport-name-column {
            position: sticky;
            right: 0;
            z-index: 2;
            min-width: 150px;
            background: #0f172a;
        }

        .airport-matrix thead .airport-name-column {
            z-index: 3;
        }

        .code-cell-form {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 220px;
        }

        .airport-code-input {
            min-width: 140px;
            width: 100%;
        }

        .button-small {
            padding: 8px 10px;
            white-space: nowrap;
        }
       .search-box-form {
    margin-bottom: 12px;
}


.search-box-grid {
    display: grid;

    grid-template-columns:
        .8fr
        1fr
        1fr
        1fr
        auto;

    gap: 16px;

    align-items: end;

    padding: 20px;

    background: #0f172a;

    border:
        1px solid #334155;

    border-radius: 8px;
}


.search-box-grid .form-field {
    margin-bottom: 0;
}


.search-submit-field {
    display: flex;

    align-items: end;
}


.search-submit-field .button {
    height: 48px;

    padding-left: 24px;

    padding-right: 24px;
}


.requests-header {
    margin-top: 36px;

    margin-bottom: 12px;
}


.requests-header h2 {
    margin-bottom: 4px;
}


.request-section {
    margin-top: 34px;
}


.request-section
.requests-header {
    margin-top: 0;
}


.compact-empty-state {
    padding: 24px 16px;
}


#departure-date-jalali {
    text-align: center;

    direction: ltr;
}


@media (
    max-width: 1000px
) {

    .search-box-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
    }

}


@media (
    max-width: 600px
) {

    .search-box-grid {
        grid-template-columns:
            1fr;
    }


    .search-submit-field
    .button {

        width: 100%;
    }

}
    </style>

</head>

<body>

<nav>

    <div class="nav-container">

        <span class="brand">مدیریت خزشگر پرواز</span>

        <a href="/control/dashboard" {% if request.url.path == '/control/dashboard' %}aria-current="page"{% endif %}>
            داشبورد
        </a>
        <a
            href="/control/search-box/page"

            {% if   request.url.path.startswith(
                    '/control/search-box'
                )
            %}

                aria-current="page"

            {% endif %}
        >
            جستجوی پرواز
        </a>

        <a href="/control/airlines/page" {% if request.url.path.startswith('/control/airlines') %}aria-current="page"{% endif %}>
            ایرلاین‌ها
        </a>

        <a href="/control/websites/page" {% if request.url.path.startswith('/control/websites') %}aria-current="page"{% endif %}>
            وب‌سایت‌ها
        </a>

        <a
        href="/control/flight-paths/page/domestic"
        {% if request.url.path == '/control/flight-paths/page/domestic' %}
        aria-current="page"
        {% endif %}
    >
        فرودگاه‌های داخلی
    </a>
    
    <a
        href="/control/flight-paths/page/foreign"
        {% if request.url.path == '/control/flight-paths/page/foreign' %}
        aria-current="page"
        {% endif %}
    >
        فرودگاه‌های خارجی
    </a>

    </div>

</nav>


<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
