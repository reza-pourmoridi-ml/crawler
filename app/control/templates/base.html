<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crawler Control{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 40px; background: #0f172a; color: #e2e8f0; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #f8fafc; }
        mark { background: #22c55e; color: #022c22; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
